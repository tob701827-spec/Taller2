<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTOMECANICA CAÑETE HERMANOS</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- BOTÓN DE ACCESO ADMIN EN LA ESQUINA SUPERIOR DERECHA -->
    <div style="position: absolute; top: 20px; right: 20px;">
        <button type="button" class="btn-secondary" onclick="abrirModalAdmin()" style="font-size: 0.85rem;">
            🔐 Acceso Admin
        </button>
    </div>

    <!-- VISTA 1: PORTAL PÚBLICO DEL CLIENTE -->
    <div id="vista-portal" class="portal-container">
       <header class="portal-header">
    <!-- Muestra la tarjeta o logo que me enviaste -->
     <img src="taller.png" alt="Automecánica Cañete Hermanos" style="max-width: 250px; width: 100%; margin-bottom: 15px;">
    
    <h1>AUTOMECANICA <span>CAÑETE HERMANOS</span></h1>
    <p>Especialistas en Reparación de Cajas Automáticas</p>
</header>

        <!-- Única tarjeta para el cliente -->
        <div class="card portal-card" style="max-width: 600px; margin: 0 auto;">
            <h3>🚗 Consulta de Cliente</h3>
            <p>Ingresa la matrícula de tu vehículo para ver su historial y estado actual.</p>
            <form id="form-consulta">
                <div class="input-group">
                    <label for="input-matricula">Matrícula / Patente</label>
                    <input type="text" id="input-matricula" placeholder="Ej: ABC-123" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Buscar Vehículo</button>
            </form>
        </div>
    </div>

    <!-- MODAL EMERGENTE PARA LOGIN DE ADMINISTRADOR (Oculto por defecto) -->
    <div id="modal-admin-login" class="modal" style="display: none;">
        <div class="modal-content" style="position: relative;">
            <!-- Botón para cerrar la ventanita -->
            <button onclick="cerrarModalAdmin()" style="position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 1.2rem; cursor: pointer;">✕</button>
            
            <h3>🔐 Acceso Administrador</h3>
            <p style="font-size: 0.85rem; color: #666; margin-bottom: 20px;">Ingresa tus credenciales para acceder al panel.</p>
            
            <form id="form-login" onsubmit="event.preventDefault(); iniciarSesion();">
                <div class="input-group">
                    <label for="auth-email">Correo Electrónico</label>
                    <input type="email" id="auth-email" placeholder="admin@taller.com" required>
                </div>
                <div class="input-group">
                    <label for="auth-password">Contraseña</label>
                    <input type="password" id="auth-password" placeholder="••••••••" required>
                </div>
                <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
                    <button type="button" class="btn-secondary" onclick="cerrarModalAdmin()">Cancelar</button>
                    <button type="submit" class="btn-primary">Iniciar Sesión</button>
                </div>
            </form>
        </div>
    </div>

    <script src="admin.js"></script>
    <script>
        // Funciones auxiliares para abrir/cerrar la ventanita de admin
        function abrirModalAdmin() {
            document.getElementById('modal-admin-login').style.display = 'flex';
        }
        function cerrarModalAdmin() {
            document.getElementById('modal-admin-login').style.display = 'none';
        }
    </script>
</body>
</html>
